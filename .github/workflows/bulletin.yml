# Tâche du miroir : fabrique les tickets et publie le bulletin (spec docs/superpowers/specs/2026-11-11-consigne-signee-fin-de-beta-design.md, § 7.2).
# Copiée dans le dépôt du miroir par « tools/consigne.py installer-miroir ». Aucun secret sauf CLE_FRAICHEUR, lue à UNE étape seulement.
# À FAIRE avant la mise en service (docs/consignes/2026-11-11_a-faire-avant-miroir.md) : remplacer chaque « @vN »
# par l'empreinte complète (40 caractères) du commit épinglé. « installer-miroir » REFUSE tant qu'une action n'est pas épinglée.
name: bulletin

on:
  schedule:
    - cron: "17 2 * * *"
    - cron: "17 14 * * *"
  push:
    branches: [main]
    paths:
      - "source/**"
  workflow_dispatch:

concurrency:
  group: bulletin
  cancel-in-progress: false

jobs:
  bulletin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
    steps:
      - name: "Récupérer le dépôt (historique complet : la surveillance lit les dates des commits)"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances (empreintes vérifiées)
        run: python -m pip install --require-hashes -r outils/requirements.txt
      - name: Fabriquer le bulletin (seule étape qui lit le secret)
        run: python outils/fabriquer.py
        env:
          CLE_FRAICHEUR: ${{ secrets.CLE_FRAICHEUR }}
      - name: Enregistrer le bulletin dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f consigne.json ]; then git add consigne.json; fi
          git diff --cached --quiet || { git commit -m "bulletin $(date -u +%F)" && git push; }
      - name: Publier en pages
        run: |
          mkdir -p public
          if [ -f consigne.json ]; then cp consigne.json public/; fi
          touch public/.nojekyll
      - name: Envoyer la page
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: public
      - name: Mettre en ligne
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
      - name: Surveiller le miroir et le site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python outils/surveiller.py
      - name: Garder l'état de la surveillance
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f etat/surveillance.json ]; then git add etat/surveillance.json; fi
          git diff --cached --quiet || { git commit -m "surveillance $(date -u +%F-%H%M)" && git push; }
